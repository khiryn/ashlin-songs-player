<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ashlin Songs — Web Music Player</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="player-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">🎵</span>
        <div class="brand-text">
          <h1>Ashlin Songs</h1>
          <span class="brand-sub">Cloud Music Streamer</span>
        </div>
      </div>
      <div class="source-toggle">
        <span class="source-label">Stream Source:</span>
        <button id="btn-source-cloud" class="toggle-btn" title="Stream directly from Amazon S3">
          ☁️ AWS S3
        </button>
        <button id="btn-source-local" class="toggle-btn active" title="Play from local files (Permanent)">
          💻 Local
        </button>
      </div>
    </header>

    <!-- Main Player Card -->
    <main class="player-card">
      <div class="album-art-wrapper">
        <div class="vinyl-disc" id="vinyl-disc">
          <div class="disc-grooves"></div>
          <div class="disc-label">
            <span class="disc-note">♪</span>
          </div>
        </div>
        <div class="album-art" id="album-art">
          <div class="art-gradient"></div>
          <div class="art-content">
            <span class="art-icon">🎙️</span>
            <span class="art-title" id="art-track-title">Bottom Of The Ocean</span>
            <span class="art-artist">Ashlin</span>
          </div>
          <!-- Equalizer Animation Bars -->
          <div class="visualizer" id="visualizer">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
          </div>
        </div>
      </div>

      <!-- Track Information -->
      <div class="track-info">
        <h2 id="track-title">Bottom Of The Ocean</h2>
        <p id="track-artist">Ashlin</p>
        <span class="badge" id="source-badge">AWS S3 Cloud</span>
      </div>

      <!-- Scrubber / Progress Bar -->
      <div class="progress-section">
        <div class="progress-bar-container" id="progress-container">
          <div class="progress-bar-buffered" id="progress-buffered"></div>
          <div class="progress-bar-current" id="progress-current"></div>
          <div class="progress-thumb" id="progress-thumb"></div>
        </div>
        <div class="time-display">
          <span id="current-time">0:00</span>
          <span id="duration-time">1:15</span>
        </div>
      </div>

      <!-- Primary Controls -->
      <div class="controls-main">
        <button class="ctrl-btn secondary" id="btn-shuffle" title="Shuffle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        </button>
        <button class="ctrl-btn secondary" id="btn-prev" title="Previous Track">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn primary" id="btn-play-pause" title="Play / Pause">
          <svg class="icon-play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="ctrl-btn secondary" id="btn-next" title="Next Track">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button class="ctrl-btn secondary" id="btn-repeat" title="Repeat Track">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>

      <!-- Volume Slider -->
      <div class="volume-container">
        <button class="vol-btn" id="btn-mute" title="Mute / Unmute">
          <svg class="icon-vol-high" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <svg class="icon-vol-muted" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" title="Volume">
      </div>
    </main>

    <!-- Playlist Section -->
    <section class="playlist-section">
      <div class="playlist-header">
        <h3>Playlist</h3>
        <span class="track-count" id="track-count">3 tracks</span>
      </div>
      <ul class="playlist" id="playlist-container">
        <!-- Rendered by JS -->
      </ul>
    </section>

    <!-- Cloud Info Banner -->
    <footer class="cloud-footer">
      <div class="cloud-info">
        <span class="cloud-dot"></span>
        <span>Hosted on <strong>AWS S3</strong> (<code>s3://ashlin-songs-bucket/audio/</code>) &bull; Region: <code>us-east-2</code></span>
      </div>
    </footer>
  </div>

  <!-- HTML5 Audio Element -->
  <audio id="audio-player" preload="metadata"></audio>

  <script src="app.js"></script>
</body>
</html>
